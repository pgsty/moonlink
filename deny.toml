[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    # Moonlink permission.
    "LicenseRef-BSL-1.1",
    "MIT",
    "Unicode-3.0",
]

[sources]
unknown-git = "deny"
allow-git = [
    "https://github.com/Mooncake-Labs/rust-postgres.git?rev=14c8e599f5551a8caa96ff5023685a6f537a1455",
]

# Advisories without a fix moonlink can take. Each entry says why it is acceptable; remove it once a fix is reachable.
[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, with no known vulnerability; it only expands macros at compile time" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, with no known vulnerability; moonlink encodes its own RPC and metadata messages with it" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no known vulnerability; arrow, parquet, iceberg and postgres-types depend on it and moonlink converts Postgres dates and timestamps with it, so replacing it (jiff or time) needs those upstreams to move first" },
]

# TODO(hjiang): Resolve all duplicate dependencies.
[bans]
skip = [
    { name = "bitflags" },
    { name = "darling" },
    { name = "darling_core" },
    { name = "darling_macro" },
    { name = "foldhash" },
    { name = "getrandom" },
    { name = "hashbrown" },
    { name = "itertools" },
    { name = "nix" },
    { name = "ordered-float" },
    { name = "quick-xml" },
    { name = "rand" },
    { name = "rand_chacha" },
    { name = "rand_core" },
    { name = "spin" },
    { name = "socket2" },
    { name = "typed-builder" },
    { name = "typed-builder-macro" },
    { name = "windows-link" },
    { name = "windows-sys" },
    { name = "windows-result" },
    { name = "windows-strings" },
]
